name: Autonomous Director core

on:
  push:
    branches: [feat/autonomous-colonists-1.7]
    paths:
      - 'mods/AutonomousColonists/**'
      - '.github/workflows/autonomous-director.yml'
  pull_request:
    paths:
      - 'mods/AutonomousColonists/**'
      - '.github/workflows/autonomous-director.yml'

permissions:
  contents: read

jobs:
  director:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mods/AutonomousColonists
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test director scenarios and randomized invariants (no game files)
        run: dotnet run --project Tests/Director/AutonomousColonists.Director.Tests.csproj -c Release -- --report TestResults/director-tests.json
      - uses: actions/upload-artifact@v4
        with:
          name: autonomous-director-tests
          path: mods/AutonomousColonists/TestResults/director-tests.json
          if-no-files-found: error
